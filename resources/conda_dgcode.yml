name: dgcode
channels:
  - nodefaults
  - conda-forge
dependencies:
  - python
  - compilers
  - bash
  - simple-build-dgcode >= 1.3.0
  - ncrystal >= 4.1.6
  - mcpl >= 2.0.0
  - matplotlib
  - zlib
  - geant4>=11.4.3,<11.5.0
  - expat
  - openscenegraph
  - scipy
  - hdf5
  - pysimplegui<5 #v5 is no longer open source
  - pip
