name: 'upload-logs'
description: >-
  Gather CI logs of this job (anything already written to ./ci-logs, plus the
  test results and CMake output from any simplebuild cache directories found
  in the workspace), and upload them as a single artifact. Use with
  "if: always()", so logs are also uploaded when earlier steps failed.
inputs:
  name:
    description: Unique (within the workflow run) name of this job/leg
    type: string
    required: true

runs:
  using: "composite"
  steps:
    - name: Gather logs
      shell: bash
      run: |
        set -u
        mkdir -p ci-logs
        #Test results (but not the potentially large files in the rundirs) and
        #cmake output from all simplebuild cache dirs in the workspace:
        find . -type d -name simplebuild_cache -not -path './ci-logs/*' -prune | while read -r cachedir; do
          dest="ci-logs/sbcache/${cachedir#./}"
          if [ -d "${cachedir}/bld/testresults" ]; then
            for d in "${cachedir}"/bld/testresults/*/; do
              [ -d "$d" ] || continue
              mkdir -p "${dest}/testresults/$(basename "$d")"
              find "$d" -maxdepth 1 -type f -exec cp {} "${dest}/testresults/$(basename "$d")/" \;
            done
          fi
          if [ -d "${cachedir}/bld/cmake" ]; then
            mkdir -p "${dest}/cmake"
            find "${cachedir}/bld/cmake" -maxdepth 1 -type f -name '*.txt' -not -name 'CMakeCache.txt' \
              -exec cp {} "${dest}/cmake/" \;
          fi
        done
        #Sphinx linkcheck results (lists all broken links):
        if [ -f doc/build/linkcheck/output.txt ]; then
          cp doc/build/linkcheck/output.txt ci-logs/sphinx_linkcheck_output.txt
        fi
        echo "CI_TIMING: $(date -u '+%Y-%m-%dT%H:%M:%SZ') -- logs gathered" >> ci-logs/timing.log
        du -sh ci-logs

    - name: Upload logs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-logs-${{ inputs.name }}
        path: ci-logs
        if-no-files-found: warn
