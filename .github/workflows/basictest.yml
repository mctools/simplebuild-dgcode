name: basictest
on:
  push:
  pull_request:
  schedule:
    - cron: '30 22 * * 0'  # 22:30 every Sunday

# Workflow which pip installs the source code and checks that both bundles build
# and runs tests in both release and debug mode. For simplicity, a lot of
# optional externals (including Geant4!) will be missing, so this test is not
# very comprehensive.

# Syntax:
#   https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# Lint:
#   https://github.com/rhysd/actionlint

jobs:
  build:
    strategy:
      matrix:
        include:
          #NOTE Available python versions (including RC ones like '3.13.0-rc.1'
          #can be found in:
          #https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.10' }
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.11' }
          - { os: ubuntu-latest, CC: clang,    CXX: clang++,    python: '3.12' }
          - { os: ubuntu-latest, CC: gcc-12,   CXX: g++-12,     python: '3.13' }
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.14' }
          - { os: macos-latest,      CC: clang,    CXX: clang++,    python: "3.12" }
    name: ${{ matrix.os }}.${{ matrix.CC }}.python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -eux {0}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: src

    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}

    - name: Lint python
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/03_lint_python.log") 2>&1
           python3 -m pip install ruff
           ./src/devel/ruff.x

    - name: Pip install cmake and pybind11
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/04_pip_install_cmake_and_pybind11.log") 2>&1
           python3 -m pip install pybind11
           python3 -m pip install cmake
           which python3
           python3 --version
           python3 -mpybind11 --version
           which cmake
           cmake --version

    - name: Install
      run: |
           mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
           exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/05_install.log") 2>&1
           #For dev work do these two lines instead:
           #  python3 -m pip install git+https://github.com/mctools/simplebuild@tk_volatile
           #  python3 -m pip install --no-deps ./src
           python3 -m pip install ./src
           echo "sb --version:"
           sb --version

    - name: Build-and-test-minimal
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
        exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/06_build_and_test_minimal.log") 2>&1
        set -x
        mkdir test1
        cd test1
        sb --init dgcode_val
        sb -t --testexcerpts=100
        sbenv sb_core_extdeps --require-disabled NCrystal Numpy matplotlib Geant4
        sbenv sb_core_extdeps --require ZLib

    - name: Install-more-deps
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
        exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/07_install_more_deps.log") 2>&1
        python3 -m pip install numpy ncrystal matplotlib
        nctool --test

    - name: Build-and-test-release
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
        exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/08_build_and_test_release.log") 2>&1
        set -x
        mkdir test2
        cd test2
        sb --init dgcode_val COMPACT
        sb --pkgi DGCodeRecommendedNoGUI
        sb -t --testexcerpts=100
        sbenv sb_core_extdeps --require-disabled Geant4
        sbenv sb_core_extdeps --require NCrystal Numpy matplotlib ZLib

    - name: Build-and-test-debug
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
        exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/09_build_and_test_debug.log") 2>&1
        set -x
        mkdir test3
        cd test3
        sb --init dgcode_val DEBUG
        sb -t --testexcerpts=100
        sbenv sb_core_extdeps --require-disabled Geant4
        sbenv sb_core_extdeps --require NCrystal Numpy matplotlib ZLib

    - name: Upload logs
      if: always()
      uses: ./src/.github/actions/upload-logs
      with:
        name: ${{ matrix.os }}.${{ matrix.CC }}.python-${{ matrix.python }}

  collect_logs:
    #Single job downloading all per-leg "ci-logs-*" artifacts above and
    #bundling them into one tarball, so the logs of all legs can be
    #downloaded with a single click:
    name: Collect all CI logs
    needs: [ build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all per-leg logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-logs-*
          path: all-ci-logs

      - name: Bundle into a single tarball
        env:
          #For pull requests, github.sha is a temporary merge commit, so use
          #the commit of the PR branch instead:
          CI_LOGS_FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "CI_LOGS_SHA=${CI_LOGS_FULL_SHA:0:10}" >> "$GITHUB_ENV"
          mkdir -p all-ci-logs
          tar -czf all-ci-logs-basictest-${CI_LOGS_FULL_SHA:0:10}.tar.gz all-ci-logs

      - name: Upload combined log tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-ci-logs-basictest-${{ env.CI_LOGS_SHA }}
          path: all-ci-logs-basictest-${{ env.CI_LOGS_SHA }}.tar.gz
          if-no-files-found: warn
