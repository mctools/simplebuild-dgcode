name: cppcheck
on:
  push:
  pull_request:
  schedule:
    - cron: '30 22 * * 2'  # 22:30 every Wednesday

jobs:

  build:
    name: cppcheck
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SOLVER: libmamba

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./src_co

      - name: Setup conda environment
        uses: ./src_co/.github/actions/setup
        with:
          CACHED_NOARCH_DEF_PY_FILE: ./src_co/.github/resources/cached_noarch_definitions.py
          CONDA_ENV_FILE : ./src_co/.github/resources/conda-setup.yml

      - name: Install cppcheck
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/03_install_cppcheck.log") 2>&1
          conda install --yes cppcheck

      - name: Install
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/04_install.log") 2>&1
          set -eux
          #TEMPORARY: Use simplebuild from its sbldpy branch (needed for pymod_*
          #support), until a simplebuild release supports it. The release tags
          #are fetched from upstream to get a proper version number:
          git clone --quiet --branch sbldpy https://github.com/tkittel/simplebuild "${RUNNER_TEMP}/sbldpy_simplebuild"
          git -C "${RUNNER_TEMP}/sbldpy_simplebuild" fetch --quiet --tags https://github.com/mctools/simplebuild
          "${CONDA_EXE}" remove --yes --force --prefix "${CONDA_PREFIX}" simple-build-system
          python3 -m pip install --no-deps "${RUNNER_TEMP}/sbldpy_simplebuild"
          #The conda package also installs the shell snippet as an activation script
          #(needed e.g. for the environment to be set up after "sb" commands):
          mkdir -p "${CONDA_PREFIX}/etc/conda/activate.d"
          cp "${RUNNER_TEMP}/sbldpy_simplebuild/src/_simple_build_system/data/resources/shellrc_snippet.sh" \
             "${CONDA_PREFIX}/etc/conda/activate.d/simple-build-system_activate.sh"
          python3 -m pip install --no-deps ./src_co
          echo "sb --version: "$(sb --version)

      - name: Build and export commands
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/05_build_and_export_commands.log") 2>&1
          set -eu
          test -f $CONDA_PREFIX/share/Geant4/data/NDL*/Elastic/CrossSection/13_27_Aluminum.z
          geant4-config  --version
          mkdir test_rel && cd test_rel
          sb --init dgcode_val
          sb --exportcmds cmds.json  --requirepkg=DGCodeRecommended
          test -f cmds.json

      - name: Run cppcheck
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/06_run_cppcheck.log") 2>&1
          set -eux
          cd test_rel
          test -f cmds.json
          mkdir ./cppcheck_cache
          if [ "$RUNNER_OS" == "macOS" ]; then
            #macos runners are already slow enough
            export tmp_cppcheck_level="normal"
          else
            export tmp_cppcheck_level="exhaustive"
          fi
          cppcheck --inline-suppr --project=cmds.json --check-level=${tmp_cppcheck_level} -j4 --cppcheck-build-dir="$PWD"/cppcheck_cache -q --suppress='*:'"$CONDA_PREFIX"'/include/*' --suppress=throwInEntryPoint --error-exitcode=1

      - name: Upload logs
        if: always()
        uses: ./src_co/.github/actions/upload-logs
        with:
          name: cppcheck

  collect_logs:
    #Single job downloading all per-leg "ci-logs-*" artifacts above and
    #bundling them into one tarball, so the logs of all legs can be
    #downloaded with a single click:
    name: Collect all CI logs
    needs: [ build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all per-leg logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-logs-*
          path: all-ci-logs

      - name: Bundle into a single tarball
        env:
          #For pull requests, github.sha is a temporary merge commit, so use
          #the commit of the PR branch instead:
          CI_LOGS_FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "CI_LOGS_SHA=${CI_LOGS_FULL_SHA:0:10}" >> "$GITHUB_ENV"
          mkdir -p all-ci-logs
          tar -czf all-ci-logs-cppcheck-${CI_LOGS_FULL_SHA:0:10}.tar.gz all-ci-logs

      - name: Upload combined log tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-ci-logs-cppcheck-${{ env.CI_LOGS_SHA }}
          path: all-ci-logs-cppcheck-${{ env.CI_LOGS_SHA }}.tar.gz
          if-no-files-found: warn
