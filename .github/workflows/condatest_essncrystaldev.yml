name: test-essncrystaldev-short
on:
  push:
  pull_request:
  schedule:
    - cron: '30 8 * * 2'  # 8:30 every Tuesday

  workflow_dispatch:
    #Disabled along with the tmate step below:
    #inputs:
    #  manual-debugging:
    #    type: boolean
    #    description: Launch manual debugging tmate session on failure
    #    default: false

jobs:

  build:
    strategy:
      #fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.11' }
          - { os: ubuntu-latest, CC: gcc,      CXX: g++,        python: '3.12' }
          - { os: macos-latest,  CC: clang,    CXX: clang++,    python: "3.11" }
    name: ${{ matrix.os }}.${{ matrix.CC }}.python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
      CONDA_SOLVER: libmamba

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./src_co

      - name: Checkout mctools/ncrystal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mctools/ncrystal
          path: ./src_ncrystal

      - name: Checkout project repo
        env: # Or as an environment variable
          THEACCESSTOKEN: ${{ secrets.ACCESS_TOKEN_NCRYSTALDEV }}
        run: |
          set -eu
          test "${THEACCESSTOKEN:-}" != "" || ( echo "Access token missing"; exit 1 )
          git clone --depth=1 'https://usernamedoesnotmatter:'"${THEACCESSTOKEN}"'@git.esss.dk/ncrystal/ncrystaldev.git' ./src_testproject

      - name: Setup conda environment
        uses: ./src_co/.github/actions/setup
        with:
          PYTHON_VERSION: ${{ matrix.python }}
          CACHED_NOARCH_DEF_PY_FILE: ./src_co/.github/resources/cached_noarch_definitions.py
          CONDA_ENV_FILE : ./src_co/.github/resources/conda-setup.yml

      #NCrystal needs extra packages:
      - name: Install extra conda pkgs
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/05_install_extra_conda_pkgs.log") 2>&1
          conda env update --name simplebuild_dgcode --file ./src_ncrystal/devel/reqs/conda_all_and_devel.yml

      - name: Install
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/06_install.log") 2>&1
          set -eu
          #For dev work: python3 -m pip install git+https://github.com/mctools/simplebuild@whateverbranchname
          #For dev work: python3 -m pip install --no-deps ./src_co
          #TEMPORARY: Use simplebuild from its sbldpy branch (needed for pymod_*
          #support), until a simplebuild release supports it. The release tags
          #are fetched from upstream to get a proper version number:
          git clone --quiet --branch sbldpy https://github.com/tkittel/simplebuild "${RUNNER_TEMP}/sbldpy_simplebuild"
          git -C "${RUNNER_TEMP}/sbldpy_simplebuild" fetch --quiet --tags https://github.com/mctools/simplebuild
          "${CONDA_EXE}" remove --yes --force --prefix "${CONDA_PREFIX}" simple-build-system
          python3 -m pip install --no-deps "${RUNNER_TEMP}/sbldpy_simplebuild"
          #The conda package also installs the shell snippet as an activation script
          #(needed e.g. for the environment to be set up after "sb" commands):
          mkdir -p "${CONDA_PREFIX}/etc/conda/activate.d"
          cp "${RUNNER_TEMP}/sbldpy_simplebuild/src/_simple_build_system/data/resources/shellrc_snippet.sh" \
             "${CONDA_PREFIX}/etc/conda/activate.d/simple-build-system_activate.sh"
          python3 -m pip install --no-deps ./src_co
          echo "sb --version: "$(sb --version)

      - name: Make ncrystaldynamic bundle discoverable
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/07_make_ncrystaldynamic_bundle_discoverable.log") 2>&1
          pip install -e ./src_ncrystal/devel/simplebuild/discovery

      - name: Build (release mode)
        id: build-release-mode
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/08_build_release_mode.log") 2>&1
          set -eu
          cd src_testproject
          sb -v

      - name: Launch unit tests (release mode)
        id: test-release-mode
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          exec > >(tee -a "${GITHUB_WORKSPACE}/ci-logs/09_launch_unit_tests_release_mode.log") 2>&1
          set -eu
          cd src_testproject
          #NCLong* tests are run in a different workflow:
          sb -t --testexcerpts=100 --requirepkg=DGCodeRecommended,NCUtils,NCG4,NCTests,NCThreadVal,NCPerfVal --testfilter='!sb_nclong*'

      - name: Upload logs
        if: always()
        uses: ./src_co/.github/actions/upload-logs
        with:
          name: ${{ matrix.os }}.${{ matrix.CC }}.python-${{ matrix.python }}

      #Disabled for now (re-enable together with the manual-debugging input above):
      #- name: Setup tmate session for manual debugging
      #  uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      #  if: always() && inputs.manual-debugging == true && (steps.build-and-test-core-only.outcome != 'success' || steps.build-and-test-release-mode.outcome != 'success' || steps.build-and-test-debug-mode.outcome != 'success')
      #  with:
      #    limit-access-to-actor: true

  collect_logs:
    #Single job downloading all per-leg "ci-logs-*" artifacts above and
    #bundling them into one tarball, so the logs of all legs can be
    #downloaded with a single click:
    name: Collect all CI logs
    needs: [ build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all per-leg logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-logs-*
          path: all-ci-logs

      - name: Bundle into a single tarball
        env:
          #For pull requests, github.sha is a temporary merge commit, so use
          #the commit of the PR branch instead:
          CI_LOGS_FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "CI_LOGS_SHA=${CI_LOGS_FULL_SHA:0:10}" >> "$GITHUB_ENV"
          mkdir -p all-ci-logs
          tar -czf all-ci-logs-test-essncrystaldev-short-${CI_LOGS_FULL_SHA:0:10}.tar.gz all-ci-logs

      - name: Upload combined log tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-ci-logs-test-essncrystaldev-short-${{ env.CI_LOGS_SHA }}
          path: all-ci-logs-test-essncrystaldev-short-${{ env.CI_LOGS_SHA }}.tar.gz
          if-no-files-found: warn
